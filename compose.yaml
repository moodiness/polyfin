name: polyfin

# Set POSTGRES_PASSWORD in .env (see .env.example). Everything else is set
# in the admin app, under Settings.

services:
  postgres:
    image: postgres:18.6@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    environment:
      POSTGRES_USER: polyfin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    # PostgreSQL 18 keeps its versioned data directory below this path.
    volumes:
      - postgres_data:/var/lib/postgresql
    stop_grace_period: 1m
    restart: unless-stopped

  polyfin:
    image: ghcr.io/moodiness/polyfin:latest
    environment:
      POLYFIN_DATABASE_URL: postgresql://polyfin:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/polyfin
      # Encrypts the keys and tokens Polyfin stores, optional but advised:
      # set it in .env, and keep it, or they have to be entered again.
      POLYFIN_SECRET_KEY: ${POLYFIN_SECRET_KEY:-}
    # The cache, and by default the recordings and backups.
    volumes:
      - polyfin_data:/data
    # Reachable on the LAN: TVs and phones connect to it directly.
    ports:
      - "8096:8096"
    depends_on:
      - postgres
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

volumes:
  postgres_data:
  polyfin_data:
