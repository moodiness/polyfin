name: Upgrade

# Updating to this commit from older releases, with the embedded and the
# external database (scripts/upgradecheck, docs/development.md): each
# release's published image makes data through its APIs, then the image
# built here starts on the same database, and must apply every migration
# and answer the same data. It runs on pull requests that change a
# migration or the check itself, on each push to main but of
# documentation, and when run by hand, which may name the releases.

on:
  # As in CI: a draft's runs skip the job.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - internal/database/migrations/**
      - scripts/upgradecheck/**
      - .github/workflows/upgrade.yml
  push:
    branches: [main]
    paths-ignore:
      - docs/**
      - "*.md"
  workflow_dispatch:
    inputs:
      from:
        description: "The releases to update from, comma-separated, such as 0.80.0,latest (empty for the usual ones)"
        required: false
        default: ""

permissions:
  contents: read

# A push cancels the run of the push before, on a pull request as on main:
# the newest commit is the one tested.
concurrency:
  group: upgrade-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upgrade:
    name: Update from older releases
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          # The check builds from the standard library alone, in seconds.
          cache: false
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # As in CI: the Dockerfile's Docker Hub images through Google's
          # mirror of it.
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      # The FFmpeg archives the Dockerfile takes, kept in GitHub's cache
      # under the same key as CI's image job, as ci.yml explains.
      - name: Find the FFmpeg archives the Dockerfile takes
        id: ffmpeg-archives
        run: |
          scripts/ffmpeg-archives.sh | tee "$RUNNER_TEMP/ffmpeg-archives.txt"
          echo "key=ffmpeg-linux-$(sha256sum < "$RUNNER_TEMP/ffmpeg-archives.txt" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Restore the FFmpeg archives
        id: ffmpeg-archives-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ffmpeg-archives
          key: ${{ steps.ffmpeg-archives.outputs.key }}
      - name: Fetch the FFmpeg archives
        if: steps.ffmpeg-archives-cache.outputs.cache-hit != 'true'
        run: scripts/ffmpeg-archives.sh fetch "$RUNNER_TEMP/ffmpeg-archives"
      - name: Keep the FFmpeg archives for the next runs
        if: steps.ffmpeg-archives-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ffmpeg-archives
          key: ${{ steps.ffmpeg-archives.outputs.key }}
      - name: Build the native image
        run: |
          docker buildx build --load --build-arg VERSION=dev \
            --build-context ffmpeg-amd64-archive="$RUNNER_TEMP/ffmpeg-archives/amd64" \
            --build-context ffmpeg-arm64-archive="$RUNNER_TEMP/ffmpeg-archives/arm64" \
            --tag polyfin-local:check .
      - name: Update to it from older releases
        env:
          UPGRADE_FROM: ${{ inputs.from }}
        run: make upgrade-check UPGRADE_FROM="$UPGRADE_FROM"
