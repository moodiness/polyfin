blank_issues_enabled: false
contact_links:
  - name: Question or help with a setup
    url: https://github.com/moodiness/polyfin/discussions/categories/q-a
    about: Ask in Q&A, after searching it and the documentation.
  - name: Idea or feature request
    url: https://github.com/moodiness/polyfin/discussions/categories/ideas
    about: Post it in Ideas, where everyone can vote for it.
  - name: Security vulnerability
    url: https://github.com/moodiness/polyfin/security/advisories/new
    about: Report it privately, never in a public issue.
