# Build Polyfin from this checkout instead of pulling the published image:
#   docker compose -f compose.yaml -f compose.build.yaml up --build
# The local tag keeps a source build from shadowing a published ghcr.io tag.
services:
  polyfin:
    image: polyfin-local:dev
    pull_policy: build
    build:
      context: .
      args:
        VERSION: ${POLYFIN_VERSION:-dev}
    # Live TV recording and daily database backups, optional: the folders
    # recordings and backups are written to.
    # environment:
    #   POLYFIN_RECORDINGS_DIR: /recordings
    #   POLYFIN_BACKUP_DIR: /backups
    # volumes:
    #   - ./recordings:/recordings
    #   - ./backups:/backups
